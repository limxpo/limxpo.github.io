
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<!-- 8-BIT FONT -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #222;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

h2 {
  font-size: 20px;
  margin-top: 30px;
  font-weight: 500;
  letter-spacing: 1px;
}

/* VIDEO */

.video-container {
  position: relative;
  width: 100%;
  margin-top: 16px;
  background: #080808;
  border: 1px solid #252525;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(255,255,255,0.04);
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: #080808;
}

/* CENTER PLAY BUTTON */

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.12);
  transition: opacity .35s ease, visibility .35s ease;
}

.play-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.play-button {
  width: 68px;
  height: 68px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 0 0 4px;
  border: 1px solid rgba(255,255,255,0.65);
  border-radius: 50%;
  background: rgba(0,0,0,0.35);
  color: white;
  font-size: 23px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  transition: .3s ease;
}

.play-button:hover {
  background: rgba(255,255,255,0.15);
  border-color: #fff;
  transform: scale(1.08);
}

.play-button:active {
  transform: scale(0.94);
}

/* FOOTER TYPEWRITER */

footer {
  text-align: center;
  color: #fff;
  padding: 30px 15px;
  border-top: 1px solid #222;
  margin-top: 40px;
  min-height: 110px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.typing-text {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  font-weight: normal;
  color: #fff;
  letter-spacing: 1px;
  line-height: 2.2;
  min-height: 24px;
  text-shadow: 0 0 5px rgba(255,255,255,0.45);
  max-width: 100%;
  overflow-wrap: anywhere;
}

.typing-text::after {
  content: "|";
  margin-left: 3px;
  color: #fff;
  animation: blink 0.8s infinite;
  text-shadow: 0 0 6px #fff;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

/* MOBILE */

@media (max-width: 480px) {
  .typing-text {
    font-size: 9px;
    line-height: 2.5;
    letter-spacing: 0.5px;
  }
}

/* SNOW */

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}
</style>
</head>

<body>

<header>LIMBO</header>

<main>

<h2>My feelings inside</h2>

<div class="video-container" id="videoContainer">

  <video
    id="player"
    loop
    playsinline
    preload="auto"
  >
    <source
      src="snaptik.vn_7616757629498494241.mp4"
      type="video/mp4"
    >
  </video>

  <div class="play-overlay" id="playOverlay">
    <button
      class="play-button"
      id="playButton"
      aria-label="Play video"
    >▶</button>
  </div>

</div>

</main>

<footer>
  <div class="typing-text" id="typingText"></div>
</footer>

<canvas id="snow"></canvas>

<script>

// VIDEO WITH ORIGINAL SOUND

const player = document.getElementById("player");
const playButton = document.getElementById("playButton");
const playOverlay = document.getElementById("playOverlay");

player.muted = false;
player.volume = 1;
player.controls = false;

function updatePlayButton() {
  if (player.paused || player.ended) {
    playOverlay.classList.remove("hidden");
  } else {
    playOverlay.classList.add("hidden");
  }
}

// PLAY BUTTON

playButton.addEventListener("click", () => {
  if (player.paused) {
    player.muted = false;

    player.play().catch(error => {
      console.log("Video playback failed:", error);
      playOverlay.classList.remove("hidden");
    });
  }
});

// VIDEO EVENTS

player.addEventListener("play", updatePlayButton);
player.addEventListener("pause", updatePlayButton);
player.addEventListener("ended", updatePlayButton);


// TYPEWRITER FOOTER EFFECT

const typingText = document.getElementById("typingText");

const messages = [
  "Sometimes he wants you to know how much he misses you.",
  "Limbo loves you deeply.",
  "He wants to be with you forever.",
  "He wants you to love him forever."
];

let messageIndex = 0;
let charIndex = 0;

function typeMessage() {
  const currentMessage = messages[messageIndex];

  if (charIndex < currentMessage.length) {
    typingText.textContent += currentMessage.charAt(charIndex);
    charIndex++;

    setTimeout(typeMessage, 65);
  } else {
    const isLastMessage = messageIndex === messages.length - 1;

    setTimeout(() => {
      messageIndex = (messageIndex + 1) % messages.length;
      charIndex = 0;
      typingText.textContent = "";
      typeMessage();
    }, isLastMessage ? 5000 : 5000);
  }
}

typeMessage();


// SNOW EFFECT

const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createFlakes() {
  flakes = Array.from({length: 45}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.8 + 0.5,
    speed: Math.random() * 0.6 + 0.3,
    drift: Math.random() * 0.4 - 0.2
  }));
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  flakes.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.fill();

    f.y += f.speed;
    f.x += f.drift;

    if (f.y > canvas.height) {
      f.y = -5;
      f.x = Math.random() * canvas.width;
    }

    if (f.x > canvas.width) f.x = 0;
    if (f.x < 0) f.x = canvas.width;
  });

  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  resize();
  createFlakes();
});

resize();
createFlakes();
animate();

</script>

</body>
</html>
