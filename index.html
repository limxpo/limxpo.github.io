
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #222;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

h2 {
  font-size: 20px;
  margin-top: 30px;
  font-weight: 500;
  letter-spacing: 1px;
}

/* VIDEO */

.video-container {
  position: relative;
  width: 100%;
  margin-top: 16px;
  background: #080808;
  border: 1px solid #252525;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(255,255,255,0.04);
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: #080808;
  pointer-events: none;
}

/* MUSIC BUTTON */

.music-button {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 1001;
  width: 42px;
  height: 42px;
  border: 1px solid #333;
  border-radius: 50%;
  background: rgba(15,15,15,0.85);
  color: #fff;
  font-size: 19px;
  cursor: pointer;
}

footer {
  text-align: center;
  color: #666;
  padding: 30px;
  border-top: 1px solid #222;
  margin-top: 40px;
}

/* SNOW */

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}
</style>
</head>

<body>

<header>LIMBO</header>

<main>

<h2>My feelings inside</h2>

<div class="video-container">

  <video
    id="player"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source
      src="snaptik.vn_7616757629498494241.mp4"
      type="video/mp4"
    >
  </video>

</div>

</main>

<footer>
Sometimes he wants you to know how much he misses you.
</footer>

<audio
  id="backgroundMusic"
  src="music.mp3"
  loop
  preload="auto"
></audio>

<button
  class="music-button"
  id="musicButton"
  aria-label="Bật hoặc tắt nhạc"
>♪</button>

<canvas id="snow"></canvas>

<script>
const player = document.getElementById("player");
const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");

// VIDEO: ALWAYS MUTED

player.muted = true;
player.defaultMuted = true;
player.controls = false;

function playVideo() {
  player.play().catch(() => {});
}

playVideo();

// MUSIC

music.volume = 0.5;

function startMusic() {
  if (!music.paused) return;

  music.play().then(() => {
    musicButton.textContent = "♫";
  }).catch(() => {
    musicButton.textContent = "♪";
  });
}

// Try autoplay music
startMusic();

// Start music after first user interaction
function enableMusic() {
  startMusic();

  if (!music.paused) {
    document.removeEventListener("pointerdown", enableMusic);
  }
}

document.addEventListener("pointerdown", enableMusic);

// Music toggle
musicButton.addEventListener("click", (event) => {
  event.stopPropagation();

  if (music.paused) {
    startMusic();
  } else {
    music.pause();
    musicButton.textContent = "♪";
  }
});

// Keep video silent
player.addEventListener("volumechange", () => {
  if (!player.muted) {
    player.muted = true;
  }
});

// SNOW EFFECT

const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createFlakes() {
  flakes = Array.from({length: 45}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.8 + 0.5,
    speed: Math.random() * 0.6 + 0.3,
    drift: Math.random() * 0.4 - 0.2
  }));
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  flakes.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.fill();

    f.y += f.speed;
    f.x += f.drift;

    if (f.y > canvas.height) {
      f.y = -5;
      f.x = Math.random() * canvas.width;
    }

    if (f.x > canvas.width) f.x = 0;
    if (f.x < 0) f.x = canvas.width;
  });

  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  resize();
  createFlakes();
});

resize();
createFlakes();
animate();
</script>

</body>
</html>
