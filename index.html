
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #222;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

h2 {
  font-size: 20px;
  margin-top: 30px;
  font-weight: 500;
  letter-spacing: 1px;
}

/* VIDEO PLAYER */

.video-container {
  position: relative;
  width: 100%;
  margin-top: 16px;
  background: #080808;
  border: 1px solid #252525;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(255,255,255,0.04);
}

video {
  display: block;
  width: 100%;
  background: #080808;
}

/* CINEMATIC TOOLBAR */

.cinema-controls {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 15px;
  background: linear-gradient(
    to bottom,
    #171717,
    #080808
  );
  border-top: 1px solid #292929;
}

.control-btn {
  border: none;
  background: transparent;
  color: #ddd;
  font-size: 17px;
  cursor: pointer;
  padding: 5px;
  min-width: 25px;
  transition: 0.2s;
}

.control-btn:hover {
  color: #fff;
  transform: scale(1.08);
}

.time {
  color: #888;
  font-size: 11px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.progress {
  flex: 1;
  min-width: 0;
  height: 3px;
  appearance: none;
  background: #444;
  border-radius: 10px;
  cursor: pointer;
  outline: none;
}

.progress::-webkit-slider-thumb {
  appearance: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px rgba(255,255,255,0.5);
}

.progress::-moz-range-thumb {
  width: 9px;
  height: 9px;
  border: none;
  border-radius: 50%;
  background: #fff;
}

.video-card {
  background: #111;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  cursor: pointer;
}

.video-card:hover {
  background: #222;
}

.video-card p {
  margin: 5px 0;
}

footer {
  text-align: center;
  color: #666;
  padding: 30px;
  border-top: 1px solid #222;
  margin-top: 40px;
}

/* SNOW */

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}
</style>
</head>

<body>

<header>LIMBO</header>

<main>

<h2>My feelings inside</h2>

<div class="video-container" id="videoContainer">

  <video
    id="player"
    autoplay
    loop
    playsinline
    preload="auto"
  >
    <source
      src="snaptik.vn_7616757629498494241.mp4"
      type="video/mp4"
    >
  </video>

  <div class="cinema-controls">

    <button class="control-btn" id="playBtn"
      aria-label="Play or pause">▶</button>

    <span class="time" id="currentTime">0:00</span>

    <input
      class="progress"
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      aria-label="Video progress"
    >

    <span class="time" id="duration">0:00</span>

    <button class="control-btn" id="muteBtn"
      aria-label="Mute or unmute">♪</button>

    <button class="control-btn" id="fullscreenBtn"
      aria-label="Fullscreen">⛶</button>

  </div>
</div>

</main>

<footer>
Sometimes he wants you to know how much he misses you.
</footer>

<canvas id="snow"></canvas>

<script>
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const muteBtn = document.getElementById("muteBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const videoContainer = document.getElementById("videoContainer");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return min + ":" + String(sec).padStart(2, "0");
}

// PLAY / PAUSE

playBtn.addEventListener("click", () => {
  if (player.paused) {
    player.play().catch(() => {});
  } else {
    player.pause();
  }
});

player.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
});

player.addEventListener("pause", () => {
  playBtn.textContent = "▶";
});

// TIME AND PROGRESS

player.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(player.duration);
});

player.addEventListener("timeupdate", () => {
  currentTime.textContent = formatTime(player.currentTime);

  if (Number.isFinite(player.duration) && player.duration > 0) {
    progress.value =
      (player.currentTime / player.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(player.duration)) {
    player.currentTime =
      (progress.value / 100) * player.duration;
  }
});

// MUTE

muteBtn.addEventListener("click", () => {
  player.muted = !player.muted;
  muteBtn.textContent = player.muted ? "×" : "♪";
});

// FULLSCREEN

fullscreenBtn.addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (videoContainer.requestFullscreen) {
      await videoContainer.requestFullscreen();
    } else if (player.webkitEnterFullscreen) {
      player.webkitEnterFullscreen();
    }
  } catch (error) {
    console.log("Fullscreen unavailable", error);
  }
});

// SNOW EFFECT

const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createFlakes() {
  flakes = Array.from({length: 45}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.8 + 0.5,
    speed: Math.random() * 0.6 + 0.3,
    drift: Math.random() * 0.4 - 0.2
  }));
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  flakes.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.fill();

    f.y += f.speed;
    f.x += f.drift;

    if (f.y > canvas.height) {
      f.y = -5;
      f.x = Math.random() * canvas.width;
    }

    if (f.x > canvas.width) f.x = 0;
    if (f.x < 0) f.x = canvas.width;
  });

  requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
createFlakes();
animate();
</script>

</body>
</html>
