
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --text: #eeeeF2;
  --muted: #aaaab5;
  --border: #222228;
}

html {
  background: #000;
}

body {
  margin: 0;
  background: #000;
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* =========================
   INTRO LOADING
========================= */

#intro {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 1.3s ease, visibility 1.3s ease;
}

#intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-content {
  text-align: center;
  animation: introReveal 1.8s ease both;
}

.intro-title {
  font-family: Arial, sans-serif;
  font-size: 27px;
  font-weight: bold;
  letter-spacing: 9px;
  color: #eee;
  text-shadow: 0 0 20px rgba(255,255,255,0.15);
}

.intro-line {
  width: 0;
  height: 1px;
  background: #aaa;
  margin: 20px auto;
  animation: lineReveal 1.8s ease forwards;
}

.intro-subtitle {
  font-family: 'Manrope', sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  color: #777;
  opacity: 0;
  animation: subtitleReveal 1.5s ease 0.7s forwards;
}

@keyframes introReveal {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes lineReveal {
  to {
    width: 85px;
  }
}

@keyframes subtitleReveal {
  to {
    opacity: 1;
  }
}

/* =========================
   FADE IN
========================= */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

header {
  padding: 22px;
  border-bottom: 1px solid var(--border);
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
  text-shadow: 0 0 15px rgba(255,255,255,0.12);

  animation: fadeIn 1.2s ease both;
  animation-delay: 0.1s;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

/* =========================
   MAIN TITLE
========================= */

h2 {
  font-family: Arial, sans-serif;
  font-size: 20px;
  margin-top: 30px;
  font-weight: 500;
  letter-spacing: 1px;
  color: #e5e5e9;
  text-shadow: 0 0 12px rgba(255,255,255,0.12);

  animation: fadeIn 1.2s ease both;
  animation-delay: 0.4s;
}

/* =========================
   VIDEO
========================= */

.video-container {
  position: relative;
  width: 100%;
  margin-top: 16px;
  background: #080808;
  border: 1px solid #252525;
  border-radius: 10px;
  overflow: hidden;

  box-shadow:
    0 10px 40px rgba(255,255,255,0.04),
    0 0 25px rgba(255,255,255,0.015);

  animation: fadeIn 1.5s ease both;
  animation-delay: 0.8s;
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: #080808;
}

/* PLAY BUTTON */

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.12);
  transition: opacity .35s ease, visibility .35s ease;
}

.play-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.play-button {
  width: 68px;
  height: 68px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 0 0 4px;

  border: 1px solid rgba(255,255,255,0.65);
  border-radius: 50%;
  background: rgba(0,0,0,0.35);
  color: white;
  font-size: 23px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  transition: .3s ease;
}

.play-button:hover {
  background: rgba(255,255,255,0.15);
  border-color: #fff;
  transform: scale(1.08);
}

.play-button:active {
  transform: scale(0.94);
}

/* =========================
   FOOTER
========================= */

footer {
  text-align: center;
  color: #fff;
  padding: 30px 15px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
  min-height: 110px;

  display: flex;
  justify-content: center;
  align-items: center;

  animation: fadeIn 1.5s ease both;
  animation-delay: 1.2s;
}

.typing-text {
  font-family: 'Manrope', sans-serif;
  font-size: 16px;
  font-weight: 400;
  color: #C8C8D0;
  letter-spacing: 1.2px;
  line-height: 2;
  min-height: 24px;
  text-shadow: 0 0 8px rgba(200,200,220,0.2);
  max-width: 100%;
  overflow-wrap: anywhere;
}

.typing-text::after {
  content: "|";
  margin-left: 3px;
  color: #E5E5F0;
  animation: blink 0.8s infinite;
  text-shadow: 0 0 7px rgba(220,220,255,0.7);
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

/* =========================
   FILM GRAIN
========================= */

#filmGrain {
  position: fixed;
  inset: -50%;
  width: 200%;
  height: 200%;
  pointer-events: none;
  z-index: 998;
  opacity: 0.075;

  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");

  animation: grainMove .22s steps(2) infinite;
}

@keyframes grainMove {
  0% {
    transform: translate(0,0);
  }
  25% {
    transform: translate(-2%,2%);
  }
  50% {
    transform: translate(2%,-1%);
  }
  75% {
    transform: translate(-1%,-2%);
  }
  100% {
    transform: translate(2%,1%);
  }
}

/* =========================
   SNOW
========================= */

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {
  header {
    font-size: 20px;
  }

  h2 {
    font-size: 18px;
  }

  .typing-text {
    font-size: 14px;
    letter-spacing: 0.7px;
    line-height: 2.1;
  }

  .play-button {
    width: 60px;
    height: 60px;
  }

  .intro-title {
    font-size: 23px;
  }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  #filmGrain {
    animation: none;
  }

  *, *::before, *::after {
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- INTRO LOADING -->

<div id="intro">
  <div class="intro-content">
    <div class="intro-title">LIMBO</div>
    <div class="intro-line"></div>
    <div class="intro-subtitle">A PLACE BETWEEN FEELINGS</div>
  </div>
</div>

<!-- FILM GRAIN -->

<div id="filmGrain"></div>

<!-- HEADER -->

<header>LIMBO</header>

<main>

  <h2>My feelings inside</h2>

  <!-- VIDEO -->

  <div class="video-container" id="videoContainer">

    <video
      id="player"
      loop
      playsinline
      preload="auto"
    >
      <source
        src="snaptik.vn_7616757629498494241.mp4"
        type="video/mp4"
      >
    </video>

    <div class="play-overlay" id="playOverlay">

      <button
        class="play-button"
        id="playButton"
        aria-label="Play video"
      >▶</button>

    </div>

  </div>

</main>

<!-- FOOTER -->

<footer>
  <div class="typing-text" id="typingText"></div>
</footer>

<!-- SNOW -->

<canvas id="snow"></canvas>

<script>

/* =========================
   INTRO LOADING
========================= */

const intro = document.getElementById("intro");

window.addEventListener("load", () => {
  setTimeout(() => {
    intro.classList.add("hide");
  }, 2200);
});


/* =========================
   VIDEO WITH ORIGINAL SOUND
========================= */

const player = document.getElementById("player");
const playButton = document.getElementById("playButton");
const playOverlay = document.getElementById("playOverlay");

player.muted = false;
player.volume = 1;
player.controls = false;

function updatePlayButton() {
  if (player.paused || player.ended) {
    playOverlay.classList.remove("hidden");
    playButton.textContent = "▶";
    playButton.setAttribute("aria-label", "Play video");
  } else {
    playOverlay.classList.add("hidden");
    playButton.textContent = "Ⅱ";
    playButton.setAttribute("aria-label", "Pause video");
  }
}

playButton.addEventListener("click", () => {

  if (player.paused) {

    player.muted = false;

    player.play().catch(error => {
      console.log("Video playback failed:", error);
      playOverlay.classList.remove("hidden");
    });

  } else {

    player.pause();

  }

});

player.addEventListener("play", updatePlayButton);
player.addEventListener("pause", updatePlayButton);
player.addEventListener("ended", updatePlayButton);


/* =========================
   ADVANCED TYPEWRITER
========================= */

const typingText = document.getElementById("typingText");

const messages = [
  "Sometimes Limbo wants you to know how much he misses you.",
  "Limbo loves you deeply.",
  "Limbo wants to be with you forever.",
  "Limbo wants you to love him forever."
];

let messageIndex = 0;
let charIndex = 0;
let deleting = false;

const typingSpeed = 115;
const deletingSpeed = 45;
const pauseAfterTyping = 2500;
const pauseAfterDeleting = 650;

function typeMessage() {

  const currentMessage = messages[messageIndex];

  if (!deleting) {

    typingText.textContent =
      currentMessage.substring(0, charIndex + 1);

    charIndex++;

    if (charIndex === currentMessage.length) {

      deleting = true;

      setTimeout(typeMessage, pauseAfterTyping);

    } else {

      setTimeout(typeMessage, typingSpeed);

    }

  } else {

    typingText.textContent =
      currentMessage.substring(0, charIndex - 1);

    charIndex--;

    if (charIndex === 0) {

      deleting = false;

      messageIndex = (messageIndex + 1) % messages.length;

      setTimeout(typeMessage, pauseAfterDeleting);

    } else {

      setTimeout(typeMessage, deletingSpeed);

    }

  }

}

window.addEventListener("load", () => {
  setTimeout(typeMessage, 2800);
});


/* =========================
   SNOW EFFECT
========================= */

const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resize() {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

function createFlakes() {

  flakes = Array.from({length: 45}, () => ({

    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,

    r: Math.random() * 1.8 + 0.5,

    speed: Math.random() * 0.6 + 0.3,

    drift: Math.random() * 0.4 - 0.2

  }));

}

function animate() {

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );

  flakes.forEach(f => {

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "rgba(255,255,255,0.65)";

    ctx.fill();

    f.y += f.speed;
    f.x += f.drift;

    if (f.y > window.innerHeight) {

      f.y = -5;
      f.x = Math.random() * window.innerWidth;

    }

    if (f.x > window.innerWidth) f.x = 0;

    if (f.x < 0) f.x = window.innerWidth;

  });

  requestAnimationFrame(animate);

}

window.addEventListener("resize", () => {

  resize();
  createFlakes();

});

resize();
createFlakes();
animate();

</script>

</body>
</html>
