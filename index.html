
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #222;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

h2 {
  font-size: 20px;
  margin-top: 30px;
}

video {
  width: 100%;
  background: #111;
  border-radius: 8px;
}

.video-card {
  background: #111;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  cursor: pointer;
}

.video-card:hover {
  background: #222;
}

.video-card p {
  margin: 5px 0;
}

footer {
  text-align: center;
  color: #666;
  padding: 30px;
  border-top: 1px solid #222;
  margin-top: 40px;
}
</style>
</head>

<body>

<header>BLACKFRAME</header>

<main>

<h2>Featured Video</h2>

<video id="player" controls playsinline>
  <source src="videos/video1.mp4" type="video/mp4">
</video>

<h2>Latest Videos</h2>

<div class="video-card"
onclick="playVideo('videos/video1.mp4')">
  <p>Video 01</p>
  <small>Watch video</small>
</div>

<div class="video-card"
onclick="playVideo('videos/video2.mp4')">
  <p>Video 02</p>
  <small>Watch video</small>
</div>

</main>

<footer>
© 2026 BLACKFRAME
</footer>

<script>
function playVideo(src) {
  const player = document.getElementById("player");
  player.src = src;
  player.load();
  player.play();
}
</script>

</body>
</html>
