
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --text: #d5d6dc;
  --muted: #777984;
  --border: rgba(210,220,240,0.08);
}

html {
  background: #030405;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  overflow-x: hidden;

  background:
    radial-gradient(
      ellipse at 50% 35%,
      #11151b 0%,
      #080a0e 48%,
      #030405 100%
    );
}

/* ATMOSPHERE */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;

  background:
    radial-gradient(
      ellipse at 50% 40%,
      transparent 20%,
      rgba(0,0,0,0.35) 75%,
      rgba(0,0,0,0.8) 120%
    );
}

/* FILM GRAIN */

#filmGrain {
  position: fixed;
  inset: -50%;
  width: 200%;
  height: 200%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.045;

  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");

  animation: grainMove .3s steps(2) infinite;
}

@keyframes grainMove {
  0% { transform: translate(0,0); }
  25% { transform: translate(-1%,1%); }
  50% { transform: translate(1%,-1%); }
  75% { transform: translate(-1%,-1%); }
  100% { transform: translate(1%,1%); }
}

/* MAIN CONTENT */

.page {
  position: relative;
  z-index: 4;
}

/* HEADER */

header {
  max-width: 1100px;
  margin: auto;
  padding: 27px 35px;

  display: flex;
  justify-content: center;
  align-items: center;

  border-bottom: 1px solid var(--border);
}

.logo {
  color: #dfe0e5;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 9px;
  padding-left: 9px;
}

/* VIDEO AREA */

main {
  max-width: 850px;
  margin: auto;
  padding: 75px 30px 20px;
}

.hero {
  display: block;
  width: 100%;
}

.video-section {
  width: 100%;
  animation: fadeIn 1.8s ease both;
}

.video-container {
  position: relative;
  width: 100%;
  overflow: hidden;

  background: #050608;
  border: 1px solid rgba(210,220,240,0.1);

  box-shadow:
    0 25px 75px rgba(0,0,0,0.65),
    0 0 35px rgba(150,180,220,0.035);
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: #050608;
}

/* PLAY BUTTON */

.play-overlay {
  position: absolute;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.18);
  transition: opacity .4s ease, visibility .4s ease;
}

.play-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.play-button {
  width: 60px;
  height: 60px;

  display: flex;
  justify-content: center;
  align-items: center;

  padding-left: 4px;

  border: 1px solid rgba(220,230,245,0.5);
  border-radius: 50%;

  background: rgba(0,0,0,0.35);
  color: #e5e8ef;

  font-size: 19px;
  cursor: pointer;

  backdrop-filter: blur(8px);
  transition: .3s ease;
}

.play-button:hover {
  background: rgba(190,210,240,0.12);
  transform: scale(1.06);
}

.play-button:active {
  transform: scale(.94);
}

/* THOUGHTS */

.thoughts {
  max-width: 760px;
  margin: 65px auto 0;
  padding: 30px 25px;

  border-top: 1px solid var(--border);

  text-align: center;
  animation: fadeIn 1.5s ease both;
  animation-delay: .6s;
}

.typing-text {
  min-height: 48px;

  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(23px, 3vw, 31px);
  font-style: italic;
  font-weight: 400;
  line-height: 1.5;

  color: #bfc3cd;
  text-shadow: 0 0 20px rgba(170,195,225,0.08);

  overflow-wrap: anywhere;
}

.typing-text::after {
  content: "|";
  margin-left: 4px;
  color: #9ba8bd;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* FOOTER */

footer {
  max-width: 1050px;
  margin: 35px auto 0;
  padding: 25px 35px;

  text-align: center;

  color: #555a64;
  font-size: 8px;
  letter-spacing: 4px;
}

/* ANIMATION */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* RAIN CANVAS */

#rain {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

/* MOBILE */

@media (max-width: 700px) {

  header {
    padding: 23px 20px;
  }

  main {
    padding: 65px 20px 20px;
  }

  .play-button {
    width: 53px;
    height: 53px;
  }

  .thoughts {
    margin: 45px 20px 0;
    padding: 25px 5px;
  }

  .typing-text {
    font-size: 25px;
  }

  footer {
    margin-top: 20px;
    padding: 25px 15px;
  }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  #filmGrain {
    animation: none;
  }

  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div id="filmGrain"></div>

<div class="page">

  <header>
    <div class="logo">LIMBO</div>
  </header>

  <main>
    <section class="hero">

      <div class="video-section">

        <div class="video-container">

          <video
            id="player"
            loop
            playsinline
            preload="auto"
          >
            <source
              src="snaptik.vn_7616757629498494241.mp4"
              type="video/mp4"
            >
          </video>

          <div class="play-overlay" id="playOverlay">

            <button
              class="play-button"
              id="playButton"
              aria-label="Play video"
            >▶</button>

          </div>

        </div>

      </div>

    </section>
  </main>

  <section class="thoughts">
    <div class="typing-text" id="typingText"></div>
  </section>

</div>

<canvas id="rain"></canvas>

<script>

/* VIDEO */

const player = document.getElementById("player");
const playButton = document.getElementById("playButton");
const playOverlay = document.getElementById("playOverlay");

player.muted = false;
player.volume = 1;
player.controls = false;

function updatePlayButton() {
  if (player.paused || player.ended) {
    playOverlay.classList.remove("hidden");
    playButton.textContent = "▶";
  } else {
    playOverlay.classList.add("hidden");
    playButton.textContent = "Ⅱ";
  }
}

playButton.addEventListener("click", () => {
  if (player.paused) {
    player.muted = false;

    player.play().catch(error => {
      console.log("Video playback failed:", error);
      playOverlay.classList.remove("hidden");
    });
  } else {
    player.pause();
  }
});

player.addEventListener("play", updatePlayButton);
player.addEventListener("pause", updatePlayButton);
player.addEventListener("ended", updatePlayButton);


/* TYPEWRITER */

const typingText = document.getElementById("typingText");

const messages = [
  "Some memories never fade.",
  "I still miss you.",
  "Somewhere, you remain.",
  "Not everything can be forgotten."
];

let messageIndex = 0;
let charIndex = 0;
let deleting = false;

const typingSpeed = 120;
const deletingSpeed = 45;
const pauseAfterTyping = 2800;
const pauseAfterDeleting = 700;

function typeMessage() {
  const currentMessage = messages[messageIndex];

  if (!deleting) {
    typingText.textContent =
      currentMessage.substring(0, charIndex + 1);

    charIndex++;

    if (charIndex === currentMessage.length) {
      deleting = true;
      setTimeout(typeMessage, pauseAfterTyping);
    } else {
      setTimeout(typeMessage, typingSpeed);
    }

  } else {
    typingText.textContent =
      currentMessage.substring(0, charIndex - 1);

    charIndex--;

    if (charIndex === 0) {
      deleting = false;
      messageIndex = (messageIndex + 1) % messages.length;
      setTimeout(typeMessage, pauseAfterDeleting);
    } else {
      setTimeout(typeMessage, deletingSpeed);
    }
  }
}

typeMessage();


/* LIGHT RAIN */

const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");

let drops = [];
let width = 0;
let height = 0;

const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

function resizeRain() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  createRain();
}

function createRain() {
  const count = Math.min(
    150,
    Math.max(45, Math.floor(width * height / 5000))
  );

  drops = Array.from({ length: count }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    length: 9 + Math.random() * 15,
    speed: 2 + Math.random() * 2.5,
    drift: -0.6 - Math.random() * 0.7,
    opacity: 0.12 + Math.random() * 0.2,
    thickness: 0.5 + Math.random() * 0.5
  }));
}

function drawRain() {
  ctx.clearRect(0, 0, width, height);

  drops.forEach(drop => {

    ctx.beginPath();

    ctx.moveTo(drop.x, drop.y);

    ctx.lineTo(
      drop.x + drop.drift,
      drop.y + drop.length
    );

    ctx.strokeStyle =
      `rgba(190, 205, 225, ${drop.opacity})`;

    ctx.lineWidth = drop.thickness;
    ctx.lineCap = "round";
    ctx.stroke();

    drop.x += drop.drift;
    drop.y += drop.speed;

    if (drop.y > height + drop.length) {
      drop.y = -drop.length;
      drop.x = Math.random() * width;
    }

    if (drop.x < -10) {
      drop.x = width + 10;
    }

  });

  if (!reduceMotion) {
    requestAnimationFrame(drawRain);
  }
}

window.addEventListener("resize", resizeRain);

resizeRain();

if (!reduceMotion) {
  drawRain();
}

</script>

</body>
</html>
