
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --text: #dedee3;
  --muted: #777984;
  --border: rgba(255,255,255,0.08);
}

html {
  background: #050506;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 40%, #111218 0%, #08090c 50%, #030304 100%);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  overflow-x: hidden;
}

/* INTRO */

#intro {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: #030304;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 1.5s ease, visibility 1.5s ease;
}

#intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-content {
  text-align: center;
  animation: introReveal 2s ease both;
}

.intro-title {
  font-size: 25px;
  font-weight: 500;
  letter-spacing: 11px;
  padding-left: 11px;
  color: #e5e5e8;
}

.intro-line {
  width: 0;
  height: 1px;
  background: #8c909d;
  margin: 22px auto;
  animation: lineReveal 2s ease forwards;
}

.intro-subtitle {
  font-size: 9px;
  letter-spacing: 4px;
  color: #676a76;
  opacity: 0;
  animation: subtitleReveal 1.5s ease 0.8s forwards;
}

@keyframes introReveal {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes lineReveal {
  to { width: 90px; }
}

@keyframes subtitleReveal {
  to { opacity: 1; }
}

/* FILM GRAIN */

#filmGrain {
  position: fixed;
  inset: -50%;
  width: 200%;
  height: 200%;
  pointer-events: none;
  z-index: 998;
  opacity: 0.065;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  animation: grainMove .22s steps(2) infinite;
}

@keyframes grainMove {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2%,2%); }
  50% { transform: translate(2%,-1%); }
  75% { transform: translate(-1%,-2%); }
  100% { transform: translate(2%,1%); }
}

/* VIGNETTE */

.vignette {
  position: fixed;
  inset: 0;
  z-index: 997;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 35%,
    rgba(0,0,0,0.25) 75%,
    rgba(0,0,0,0.72) 130%
  );
}

/* HEADER */

header {
  max-width: 1100px;
  margin: auto;
  padding: 30px 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 9px;
  padding-left: 9px;
  color: #e3e3e8;
}

/* MAIN */

main {
  max-width: 1000px;
  margin: auto;
  padding: 95px 35px 40px;
}

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 35px;
}

/* TITLE */

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 5vw, 54px);
  font-weight: 400;
  font-style: italic;
  color: #c9cbd3;
  text-align: center;
  letter-spacing: 1px;
  animation: fadeIn 1.5s ease both;
}

/* VIDEO */

.video-section {
  width: 100%;
  max-width: 760px;
  animation: fadeIn 1.7s ease both;
  animation-delay: .3s;
}

.video-container {
  position: relative;
  width: 100%;
  background: #08090c;
  border: 1px solid rgba(220,225,240,0.11);
  overflow: hidden;
  box-shadow:
    0 25px 70px rgba(0,0,0,0.65),
    0 0 30px rgba(180,200,255,0.025);
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: #08090c;
}

/* PLAY BUTTON */

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.15);
  transition: opacity .4s ease, visibility .4s ease;
}

.play-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.play-button {
  width: 62px;
  height: 62px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 0 0 4px;
  border: 1px solid rgba(220,230,255,0.55);
  border-radius: 50%;
  background: rgba(0,0,0,0.4);
  color: #e5e8ef;
  font-size: 19px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: .35s ease;
}

.play-button:hover {
  background: rgba(200,215,245,0.12);
  transform: scale(1.06);
}

.play-button:active {
  transform: scale(.94);
}

/* THOUGHTS */

.thoughts {
  max-width: 760px;
  margin: 65px auto 0;
  padding: 30px 20px;
  border-top: 1px solid var(--border);
  text-align: center;
  animation: fadeIn 1.5s ease both;
  animation-delay: .8s;
}

.typing-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(21px, 3vw, 29px);
  font-style: italic;
  font-weight: 400;
  color: #bfc2cc;
  line-height: 1.6;
  min-height: 46px;
  text-shadow: 0 0 18px rgba(180,195,230,0.08);
  overflow-wrap: anywhere;
}

.typing-text::after {
  content: "|";
  margin-left: 4px;
  color: #9ba8bd;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* FOOTER */

footer {
  max-width: 1000px;
  margin: 35px auto 0;
  padding: 25px 35px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: #555862;
  font-size: 8px;
  letter-spacing: 4px;
}

/* SNOW */

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}

/* ANIMATION */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */

@media (max-width: 700px) {
  header {
    padding: 25px 20px;
  }

  main {
    padding: 75px 20px 30px;
  }

  .hero {
    gap: 28px;
  }

  .hero-title {
    font-size: 39px;
  }

  .video-section {
    width: 100%;
  }

  .play-button {
    width: 56px;
    height: 56px;
  }

  .thoughts {
    margin-top: 45px;
    padding: 25px 12px;
  }

  .typing-text {
    font-size: 24px;
  }

  footer {
    margin-top: 25px;
    padding: 25px 15px;
    font-size: 7px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #filmGrain {
    animation: none;
  }

  *, *::before, *::after {
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<div id="intro">
  <div class="intro-content">
    <div class="intro-title">LIMBO</div>
    <div class="intro-line"></div>
    <div class="intro-subtitle">A PLACE BETWEEN FEELINGS</div>
  </div>
</div>

<div id="filmGrain"></div>
<div class="vignette"></div>

<header>
  <div class="logo">LIMBO</div>
</header>

<main>
  <section class="hero">

    <div class="hero-title">
      Somewhere between.
    </div>

    <div class="video-section">
      <div class="video-container">

        <video id="player" loop playsinline preload="auto">
          <source
            src="snaptik.vn_7616757629498494241.mp4"
            type="video/mp4"
          >
        </video>

        <div class="play-overlay" id="playOverlay">
          <button
            class="play-button"
            id="playButton"
            aria-label="Play video"
          >▶</button>
        </div>

      </div>
    </div>

  </section>
</main>

<section class="thoughts">
  <div class="typing-text" id="typingText"></div>
</section>

<footer>
  LIMBO WAS HERE
</footer>

<canvas id="snow"></canvas>

<script>

/* INTRO */

const intro = document.getElementById("intro");

window.addEventListener("load", () => {
  setTimeout(() => {
    intro.classList.add("hide");
  }, 2200);
});


/* VIDEO */

const player = document.getElementById("player");
const playButton = document.getElementById("playButton");
const playOverlay = document.getElementById("playOverlay");

player.muted = false;
player.volume = 1;
player.controls = false;

function updatePlayButton() {
  if (player.paused || player.ended) {
    playOverlay.classList.remove("hidden");
    playButton.textContent = "▶";
  } else {
    playOverlay.classList.add("hidden");
    playButton.textContent = "Ⅱ";
  }
}

playButton.addEventListener("click", () => {
  if (player.paused) {
    player.muted = false;

    player.play().catch(error => {
      console.log("Video playback failed:", error);
      playOverlay.classList.remove("hidden");
    });
  } else {
    player.pause();
  }
});

player.addEventListener("play", updatePlayButton);
player.addEventListener("pause", updatePlayButton);
player.addEventListener("ended", updatePlayButton);


/* TYPEWRITER */

const typingText = document.getElementById("typingText");

const messages = [
  "Sometimes Limbo wants you to know how much he misses you.",
  "Limbo loves you deeply.",
  "Limbo wants to be with you forever.",
  "Limbo wants you to love him forever."
];

let messageIndex = 0;
let charIndex = 0;
let deleting = false;

const typingSpeed = 115;
const deletingSpeed = 45;
const pauseAfterTyping = 2500;
const pauseAfterDeleting = 650;

function typeMessage() {
  const currentMessage = messages[messageIndex];

  if (!deleting) {
    typingText.textContent =
      currentMessage.substring(0, charIndex + 1);

    charIndex++;

    if (charIndex === currentMessage.length) {
      deleting = true;
      setTimeout(typeMessage, pauseAfterTyping);
    } else {
      setTimeout(typeMessage, typingSpeed);
    }

  } else {
    typingText.textContent =
      currentMessage.substring(0, charIndex - 1);

    charIndex--;

    if (charIndex === 0) {
      deleting = false;
      messageIndex = (messageIndex + 1) % messages.length;
      setTimeout(typeMessage, pauseAfterDeleting);
    } else {
      setTimeout(typeMessage, deletingSpeed);
    }
  }
}

window.addEventListener("load", () => {
  setTimeout(typeMessage, 2800);
});


/* ETHEREAL SNOW */

const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createFlakes() {
  flakes = Array.from({ length: 42 }, () => {
    const depth = Math.random();

    return {
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 0.5 + depth * 1.4,
      speed: 0.2 + depth * 0.45,
      drift: Math.random() * 0.3 - 0.15,
      glow: 3 + depth * 5,
      opacity: 0.25 + depth * 0.35,
      pulse: Math.random() * Math.PI * 2
    };
  });
}

function animate() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  flakes.forEach(f => {
    f.pulse += 0.012;

    const brightness =
      f.opacity * (0.85 + Math.sin(f.pulse) * 0.15);

    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);

    ctx.shadowBlur = f.glow;
    ctx.shadowColor = "rgba(195,220,255,0.8)";
    ctx.fillStyle = `rgba(215,230,255,${brightness})`;
    ctx.fill();

    ctx.shadowBlur = 0;

    f.y += f.speed;
    f.x += f.drift;

    if (f.y > window.innerHeight + 5) {
      f.y = -5;
      f.x = Math.random() * window.innerWidth;
    }

    if (f.x > window.innerWidth + 5) f.x = -5;
    if (f.x < -5) f.x = window.innerWidth + 5;
  });

  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  resize();
  createFlakes();
});

resize();
createFlakes();
animate();

</script>

</body>
</html>
