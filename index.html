
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* FADE IN */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

header {
  padding: 22px;
  border-bottom: 1px solid #222;
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;

  animation: fadeIn 1.2s ease both;
  animation-delay: 0.1s;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

/* MAIN TITLE */

h2 {
  font-family: Arial, sans-serif;
  font-size: 20px;
  margin-top: 30px;
  font-weight: 500;
  letter-spacing: 1px;

  animation: fadeIn 1.2s ease both;
  animation-delay: 0.4s;
}

/* VIDEO */

.video-container {
  position: relative;
  width: 100%;
  margin-top: 16px;
  background: #080808;
  border: 1px solid #252525;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(255,255,255,0.04);

  animation: fadeIn 1.5s ease both;
  animation-delay: 0.8s;
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: #080808;
}

/* PLAY BUTTON */

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.12);
  transition: opacity .35s ease, visibility .35s ease;
}

.play-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.play-button {
  width: 68px;
  height: 68px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 0 0 4px;
  border: 1px solid rgba(255,255,255,0.65);
  border-radius: 50%;
  background: rgba(0,0,0,0.35);
  color: white;
  font-size: 23px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  transition: .3s ease;
}

.play-button:hover {
  background: rgba(255,255,255,0.15);
  border-color: #fff;
  transform: scale(1.08);
}

.play-button:active {
  transform: scale(0.94);
}

/* FOOTER */

footer {
  text-align: center;
  color: #fff;
  padding: 30px 15px;
  border-top: 1px solid #222;
  margin-top: 40px;
  min-height: 110px;
  display: flex;
  justify-content: center;
  align-items: center;

  animation: fadeIn 1.5s ease both;
  animation-delay: 1.2s;
}

.typing-text {
  font-family: 'Manrope', sans-serif;
  font-size: 16px;
  font-weight: 400;
  color: #C8C8D0;
  letter-spacing: 1.2px;
  line-height: 2;
  min-height: 24px;
  text-shadow: 0 0 8px rgba(200,200,220,0.2);
  max-width: 100%;
  overflow-wrap: anywhere;
}

.typing-text::after {
  content: "|";
  margin-left: 3px;
  color: #E5E5F0;
  animation: blink 0.8s infinite;
  text-shadow: 0 0 7px rgba(220,220,255,0.7);
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

/* MOBILE */

@media (max-width: 480px) {
  .typing-text {
    font-size: 14px;
    letter-spacing: 0.7px;
    line-height: 2.1;
  }
}

/* SNOW */

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}
</style>
</head>

<body>

<header>LIMBO</header>

<main>

<h2>My feelings inside</h2>

<div class="video-container" id="videoContainer">

  <video
    id="player"
    loop
    playsinline
    preload="auto"
  >
    <source
      src="snaptik.vn_7616757629498494241.mp4"
      type="video/mp4"
    >
  </video>

  <div class="play-overlay" id="playOverlay">
    <button
      class="play-button"
      id="playButton"
      aria-label="Play video"
    >▶</button>
  </div>

</div>

</main>

<footer>
  <div class="typing-text" id="typingText"></div>
</footer>

<canvas id="snow"></canvas>

<script>

// VIDEO WITH ORIGINAL SOUND

const player = document.getElementById("player");
const playButton = document.getElementById("playButton");
const playOverlay = document.getElementById("playOverlay");

player.muted = false;
player.volume = 1;
player.controls = false;

function updatePlayButton() {
  if (player.paused || player.ended) {
    playOverlay.classList.remove("hidden");
  } else {
    playOverlay.classList.add("hidden");
  }
}

playButton.addEventListener("click", () => {
  if (player.paused) {
    player.muted = false;

    player.play().catch(error => {
      console.log("Video playback failed:", error);
      playOverlay.classList.remove("hidden");
    });
  }
});

player.addEventListener("play", updatePlayButton);
player.addEventListener("pause", updatePlayButton);
player.addEventListener("ended", updatePlayButton);


// TYPEWRITER EFFECT

const typingText = document.getElementById("typingText");

const messages = [
  "Sometimes he wants you to know how much he misses you.",
  "Limbo loves you deeply.",
  "He wants to be with you forever.",
  "He wants you to love him forever."
];

let messageIndex = 0;
let charIndex = 0;

function typeMessage() {
  const currentMessage = messages[messageIndex];

  if (charIndex < currentMessage.length) {
    typingText.textContent += currentMessage.charAt(charIndex);
    charIndex++;

    setTimeout(typeMessage, 125);
  } else {
    setTimeout(() => {
      messageIndex = (messageIndex + 1) % messages.length;
      charIndex = 0;
      typingText.textContent = "";
      typeMessage();
    }, 5000);
  }
}

// Start typing after page content has loaded

window.addEventListener("load", () => {
  typeMessage();
});


// SNOW EFFECT

const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createFlakes() {
  flakes = Array.from({length: 45}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.8 + 0.5,
    speed: Math.random() * 0.6 + 0.3,
    drift: Math.random() * 0.4 - 0.2
  }));
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  flakes.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.fill();

    f.y += f.speed;
    f.x += f.drift;

    if (f.y > canvas.height) {
      f.y = -5;
      f.x = Math.random() * canvas.width;
    }

    if (f.x > canvas.width) f.x = 0;
    if (f.x < 0) f.x = canvas.width;
  });

  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  resize();
  createFlakes();
});

resize();
createFlakes();
animate();

</script>

</body>
</html>
