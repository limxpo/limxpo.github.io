
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMBO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --text: #d5d9e1;
  --muted: #858d9b;
  --border: rgba(190,205,225,0.09);
}

html {
  min-height: 100%;
  background: #000;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  overflow-x: hidden;
  background: #000;
}

/* DARK ATMOSPHERE */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,0.3) 75%,
      rgba(0,0,0,0.75) 120%
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,0.08),
      rgba(0,0,0,0.35)
    );
}

/* MOONLIGHT */

#moonlight {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 50% -15%,
      rgba(150,165,195,0.105) 0%,
      rgba(95,110,145,0.035) 30%,
      transparent 62%
    );

  opacity: 0.8;
}

/* DARK FANTASY FOG */

#fog {
  position: fixed;
  inset: -25%;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
  opacity: 0.24;

  background:
    radial-gradient(
      ellipse at 20% 55%,
      rgba(150,160,180,0.14) 0%,
      transparent 42%
    ),
    radial-gradient(
      ellipse at 75% 35%,
      rgba(115,130,155,0.12) 0%,
      transparent 38%
    ),
    radial-gradient(
      ellipse at 50% 85%,
      rgba(130,140,160,0.10) 0%,
      transparent 45%
    );

  filter: blur(55px);
  animation: fogDrift 32s ease-in-out infinite alternate;
}

@keyframes fogDrift {
  0% {
    transform: translate3d(-4%, 2%, 0) scale(1);
  }

  50% {
    transform: translate3d(3%, -2%, 0) scale(1.08);
  }

  100% {
    transform: translate3d(5%, 3%, 0) scale(1.03);
  }
}

/* LIGHTNING ATMOSPHERE */

#stormGlow {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  background: rgba(195,215,255,0.08);
  transition: opacity 0.08s linear;
}

/* FILM GRAIN */

#filmGrain {
  position: fixed;
  inset: -50%;
  width: 200%;
  height: 200%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.045;

  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");

  animation: grainMove .3s steps(2) infinite;
}

@keyframes grainMove {
  0% { transform: translate(0,0); }
  25% { transform: translate(-1%,1%); }
  50% { transform: translate(1%,-1%); }
  75% { transform: translate(-1%,-1%); }
  100% { transform: translate(1%,1%); }
}

/* MAGIC PARTICLES */

#magicParticles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
}

/* MAIN CONTENT */

.page {
  position: relative;
  z-index: 4;
}

/* HEADER */

header {
  max-width: 1100px;
  margin: auto;
  padding: 27px 35px;

  display: flex;
  justify-content: center;
  align-items: center;

  border-bottom: 1px solid var(--border);
}

.logo {
  color: #dfe4ec;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 9px;
  padding-left: 9px;
}

/* VIDEO AREA */

main {
  max-width: 850px;
  margin: auto;
  padding: 75px 30px 20px;
}

.hero {
  display: block;
  width: 100%;
}

.video-section {
  width: 100%;
  animation: fadeIn 1.8s ease both;
}

.video-container {
  position: relative;
  width: 100%;
  overflow: hidden;

  background: #000;
  border: 1px solid rgba(190,210,235,0.12);

  box-shadow:
    0 25px 85px rgba(0,0,0,0.8),
    0 0 45px rgba(100,135,175,0.06);
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: #000;
}

/* PLAY BUTTON */

.play-overlay {
  position: absolute;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.2);
  transition: opacity .4s ease, visibility .4s ease;
}

.play-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.play-button {
  width: 60px;
  height: 60px;

  display: flex;
  justify-content: center;
  align-items: center;

  padding-left: 4px;

  border: 1px solid rgba(220,230,245,0.5);
  border-radius: 50%;

  background: rgba(3,8,15,0.55);
  color: #e5eaf2;

  font-size: 19px;
  cursor: pointer;

  backdrop-filter: blur(8px);
  transition: .3s ease;
}

.play-button:hover {
  background: rgba(160,185,215,0.14);
  transform: scale(1.06);
}

.play-button:active {
  transform: scale(.94);
}

/* THOUGHTS */

.thoughts {
  max-width: 760px;
  margin: 65px auto 0;
  padding: 30px 25px;

  border-top: 1px solid var(--border);

  text-align: center;
  animation: fadeIn 1.5s ease both;
  animation-delay: .6s;
}

.typing-text {
  min-height: 48px;

  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(23px, 3vw, 31px);
  font-style: italic;
  font-weight: 400;
  line-height: 1.5;

  color: #c0c9d6;
  text-shadow: 0 0 25px rgba(155,185,220,0.12);

  overflow-wrap: anywhere;
}

.typing-text::after {
  content: "|";
  margin-left: 4px;
  color: #9baec5;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* ANIMATION */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* RAIN CANVAS */

#rain {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
  z-index: 5;
  opacity: 1;
}

/* MOBILE */

@media (max-width: 700px) {
  header {
    padding: 23px 20px;
  }

  main {
    padding: 65px 20px 20px;
  }

  .play-button {
    width: 53px;
    height: 53px;
  }

  .thoughts {
    margin: 45px 20px 0;
    padding: 25px 5px;
  }

  .typing-text {
    font-size: 25px;
  }

  #fog {
    opacity: 0.19;
    filter: blur(38px);
  }
}

@media (prefers-reduced-motion: reduce) {
  #fog,
  #filmGrain {
    animation-duration: 60s;
  }
}
</style>
</head>

<body>

<div id="moonlight"></div>
<div id="fog"></div>
<div id="filmGrain"></div>
<div id="stormGlow"></div>

<div class="page">

  <header>
    <div class="logo">LIMBO</div>
  </header>

  <main>
    <section class="hero">
      <div class="video-section">
        <div class="video-container">

          <video
            id="player"
            loop
            playsinline
            preload="auto"
          >
            <source
              src="snaptik.vn_7616757629498494241.mp4"
              type="video/mp4"
            >
          </video>

          <div class="play-overlay" id="playOverlay">
            <button
              class="play-button"
              id="playButton"
              aria-label="Play video"
            >▶</button>
          </div>

        </div>
      </div>
    </section>
  </main>

  <section class="thoughts">
    <div class="typing-text" id="typingText"></div>
  </section>

</div>

<canvas id="magicParticles"></canvas>
<canvas id="rain"></canvas>

<script>

/* VIDEO */

const player = document.getElementById("player");
const playButton = document.getElementById("playButton");
const playOverlay = document.getElementById("playOverlay");

player.muted = false;
player.volume = 1;
player.controls = false;

function updatePlayButton() {
  if (player.paused || player.ended) {
    playOverlay.classList.remove("hidden");
    playButton.textContent = "▶";
  } else {
    playOverlay.classList.add("hidden");
    playButton.textContent = "Ⅱ";
  }
}

playButton.addEventListener("click", () => {
  if (player.paused) {
    player.muted = false;

    player.play().catch(error => {
      console.log("Video playback failed:", error);
      playOverlay.classList.remove("hidden");
    });
  } else {
    player.pause();
  }
});

player.addEventListener("play", updatePlayButton);
player.addEventListener("pause", updatePlayButton);
player.addEventListener("ended", updatePlayButton);


/* TYPEWRITER */

const typingText = document.getElementById("typingText");

const messages = [
  "Some memories never fade.",
  "I still miss you.",
  "Somewhere, you remain.",
  "Not everything can be forgotten."
];

let messageIndex = 0;
let charIndex = 0;
let deleting = false;

const typingSpeed = 120;
const deletingSpeed = 45;
const pauseAfterTyping = 2800;
const pauseAfterDeleting = 700;

function typeMessage() {
  const currentMessage = messages[messageIndex];

  if (!deleting) {
    typingText.textContent =
      currentMessage.substring(0, charIndex + 1);

    charIndex++;

    if (charIndex === currentMessage.length) {
      deleting = true;
      setTimeout(typeMessage, pauseAfterTyping);
    } else {
      setTimeout(typeMessage, typingSpeed);
    }

  } else {
    typingText.textContent =
      currentMessage.substring(0, charIndex - 1);

    charIndex--;

    if (charIndex === 0) {
      deleting = false;
      messageIndex = (messageIndex + 1) % messages.length;
      setTimeout(typeMessage, pauseAfterDeleting);
    } else {
      setTimeout(typeMessage, deletingSpeed);
    }
  }
}

typeMessage();


/* SHARED HELPERS */

const random = (min, max) =>
  Math.random() * (max - min) + min;


/* REALISTIC RAIN + RANDOM LIGHTNING */

const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");
const stormGlow = document.getElementById("stormGlow");

let width = 0;
let height = 0;
let drops = [];
let wind = -0.8;

let lightningBolts = [];
let lightningFlash = 0;
let nextLightning = 0;
let lightningActive = false;

let lastFrame = 0;

function createDrop(initial = false) {
  const depth = Math.random();

  return {
    x: random(-20, width + 20),
    y: initial ? random(-20, height) : random(-80, -10),

    length: random(9, 17) + depth * 17,
    speed: random(5, 9) + depth * 6,

    thickness: 0.45 + depth * 0.85,
    opacity: 0.13 + depth * 0.3,

    drift: random(0.7, 1.6) + depth * 0.7
  };
}

function resizeRain() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const count = Math.min(
    260,
    Math.max(110, Math.floor(width * height / 2600))
  );

  drops = Array.from(
    { length: count },
    () => createDrop(true)
  );
}


/* LIGHTNING GENERATOR */

function createBolt(x, y, length, spread, depth = 0) {
  const points = [{ x, y }];

  let currentX = x;
  let currentY = y;

  const segments = Math.floor(random(10, 17));

  for (let i = 0; i < segments; i++) {
    currentX += random(-spread, spread);
    currentY += length / segments;

    points.push({
      x: currentX,
      y: currentY
    });
  }

  const branches = [];

  if (depth < 2) {
    for (let i = 2; i < points.length - 2; i += 3) {
      if (Math.random() > 0.62) {
        const point = points[i];

        branches.push(
          createBolt(
            point.x,
            point.y,
            length * random(0.2, 0.4),
            spread * 0.65,
            depth + 1
          )
        );
      }
    }
  }

  return { points, branches };
}


/* DRAW LIGHTNING */

function drawBolt(bolt, alpha, main = false) {
  ctx.beginPath();

  ctx.moveTo(
    bolt.points[0].x,
    bolt.points[0].y
  );

  for (let i = 1; i < bolt.points.length; i++) {
    const point = bolt.points[i];
    ctx.lineTo(point.x, point.y);
  }

  ctx.strokeStyle =
    `rgba(215,230,255,${alpha})`;

  ctx.lineWidth = main ? 2.1 : 1.1;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.shadowBlur = main ? 22 : 12;
  ctx.shadowColor = "rgba(175,205,255,0.9)";

  ctx.stroke();

  bolt.branches.forEach(branch => {
    drawBolt(branch, alpha * 0.65, false);
  });
}


/* START LIGHTNING */

function startLightning() {
  const x = random(width * 0.12, width * 0.88);

  const bolt = createBolt(
    x,
    random(-30, 10),
    height * random(0.35, 0.7),
    random(30, 65)
  );

  lightningBolts = [bolt];

  lightningFlash = random(0.13, 0.24);
  lightningActive = true;

  if (Math.random() > 0.68) {
    lightningBolts.push(
      createBolt(
        random(width * 0.1, width * 0.9),
        0,
        height * random(0.2, 0.4),
        30
      )
    );
  }
}


/* LIGHTNING TIMING */

function updateLightning(delta) {
  const now = Date.now();

  if (!lightningActive && now >= nextLightning) {
    startLightning();
  }

  if (lightningActive) {
    lightningFlash *= Math.pow(0.91, delta / 16.67);

    if (lightningFlash < 0.008) {
      lightningFlash = 0;
      lightningActive = false;
      lightningBolts = [];

      nextLightning =
        now + random(9000, 23000);
    }
  }

  stormGlow.style.opacity = lightningFlash;
}


/* MAGIC PARTICLES */

const magicCanvas = document.getElementById("magicParticles");
const magicCtx = magicCanvas.getContext("2d");

let particles = [];

function createParticle(initial = false) {
  return {
    x: random(0, width),
    y: initial ? random(0, height) : height + random(5, 40),

    radius: random(0.5, 1.5),

    speedY: random(0.12, 0.42),
    speedX: random(-0.16, 0.16),

    opacity: random(0.15, 0.65),
    phase: random(0, Math.PI * 2),
    twinkleSpeed: random(0.008, 0.025)
  };
}

function resizeMagic() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  magicCanvas.width = Math.floor(width * dpr);
  magicCanvas.height = Math.floor(height * dpr);

  magicCanvas.style.width = width + "px";
  magicCanvas.style.height = height + "px";

  magicCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const count = Math.min(
    42,
    Math.max(18, Math.floor(width * height / 24000))
  );

  particles = Array.from(
    { length: count },
    () => createParticle(true)
  );
}

function drawMagicParticles(delta) {
  magicCtx.clearRect(0, 0, width, height);

  const frameScale = delta / 16.67;

  particles.forEach(particle => {
    particle.phase += particle.twinkleSpeed * frameScale;

    particle.x += particle.speedX * frameScale;
    particle.y -= particle.speedY * frameScale;

    const twinkle =
      0.35 + Math.sin(particle.phase) * 0.35;

    const alpha = Math.max(
      0,
      particle.opacity * twinkle
    );

    magicCtx.beginPath();

    magicCtx.arc(
      particle.x,
      particle.y,
      particle.radius,
      0,
      Math.PI * 2
    );

    magicCtx.fillStyle =
      `rgba(205,220,245,${alpha})`;

    magicCtx.shadowBlur = 9;
    magicCtx.shadowColor =
      "rgba(175,200,235,0.65)";

    magicCtx.fill();

    // Tiny glow around brighter particles
    if (particle.radius > 1.1) {
      magicCtx.beginPath();

      magicCtx.arc(
        particle.x,
        particle.y,
        particle.radius * 2.8,
        0,
        Math.PI * 2
      );

      magicCtx.fillStyle =
        `rgba(180,200,230,${alpha * 0.12})`;

      magicCtx.fill();
    }

    if (
      particle.y < -20 ||
      particle.x < -20 ||
      particle.x > width + 20
    ) {
      Object.assign(particle, createParticle());
      particle.y = height + random(5, 40);
    }
  });

  magicCtx.shadowBlur = 0;
}


/* DRAW RAIN */

function drawRain(timestamp = 0) {
  const delta = lastFrame
    ? Math.min(timestamp - lastFrame, 40)
    : 16.67;

  lastFrame = timestamp;

  ctx.clearRect(0, 0, width, height);

  wind += random(-0.006, 0.006);
  wind = Math.max(-1.5, Math.min(-0.35, wind));

  drops.forEach(drop => {
    const dx = wind * drop.drift;

    ctx.beginPath();

    ctx.moveTo(drop.x, drop.y);

    ctx.lineTo(
      drop.x + dx * 1.7,
      drop.y + drop.length
    );

    ctx.strokeStyle =
      `rgba(195,215,238,${drop.opacity})`;

    ctx.lineWidth = drop.thickness;
    ctx.lineCap = "round";

    ctx.stroke();

    drop.x += dx * (delta / 16.67);
    drop.y += drop.speed * (delta / 16.67);

    if (
      drop.y > height + drop.length ||
      drop.x < -40 ||
      drop.x > width + 40
    ) {
      Object.assign(drop, createDrop());
    }
  });

  // Magic particles
  drawMagicParticles(delta);

  // Lightning
  updateLightning(delta);

  if (lightningActive && lightningBolts.length) {
    ctx.save();

    lightningBolts.forEach((bolt, index) => {
      drawBolt(
        bolt,
        index === 0
          ? Math.min(1, lightningFlash * 4)
          : Math.min(0.7, lightningFlash * 2),
        index === 0
      );
    });

    ctx.restore();
  }

  requestAnimationFrame(drawRain);
}


/* INITIALIZE */

function initializeEffects() {
  resizeRain();
  resizeMagic();

  nextLightning = Date.now() + random(5000, 10000);

  drawRain();
}

window.addEventListener("resize", () => {
  resizeRain();
  resizeMagic();
});

initializeEffects();

</script>

</body>
</html>
